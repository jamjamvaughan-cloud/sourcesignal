# SourceSignal — PgBouncer configuration
#
# Advanced connection pooling in transaction mode. PgBouncer sits between the
# stateless Fastify API instances and PostgreSQL 16, multiplexing many client
# connections over a small pool of server connections so the database can scale
# independently of the API replica count.
#
# Copy into the pgbouncer container at /etc/pgbouncer/pgbouncer.ini (or mount
# as done in docker-compose.prod.yml).

# ---------------------------------------------------------------------------
# Databases section
# Maps a PgBouncer database name to a real PostgreSQL backend.
# ---------------------------------------------------------------------------
[databases]
sourcesignal = host=postgres port=5432 dbname=sourcesignal

# ---------------------------------------------------------------------------
# PgBouncer section
# ---------------------------------------------------------------------------
[pgbouncer]

# Network
listen_port = 5432
listen_addr = *
unix_socket_dir = /tmp

# Authentication (trust inside the trusted VPC; rotate passwords via env)
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

# Pooling mode: transaction = server released after each transaction
# (ideal for stateless API servers behind a load balancer).
pool_mode = transaction

# Client connections
max_client_conn = 2000
default_pool_size = 100
reserve_pool_size = 20
reserve_pool_timeout = 3

# Server connection limits
max_db_connections = 500
max_user_connections = 200

# Timeouts (keep TCP sockets alive through NAT / load balancer idle timeouts)
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 600
client_login_timeout = 30

# Query / transaction guards
statement_timeout = 600
query_wait_timeout = 120
idle_transaction_timeout = 600

# Compatibility with managed Postgres (Neon / Supabase / RDS)
ignore_startup_parameters = extra_float_digits

# Logging / ops
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_interval = 60

# Administrative console
admin_users = postgres
stats_users = postgres
