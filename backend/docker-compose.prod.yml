# SourceSignal Backend — Production manifest with Caddy reverse proxy
#
# Services:
#   caddy   — Reverse proxy with automatic Let's Encrypt SSL for api.sourcesignal.site
#   api     — Replicated Node.js / Fastify API (stateless), scaled to 3
#   worker  — Dedicated BullMQ background worker
#   pgbouncer— Connection pooler in transaction mode (fronts PostgreSQL)
#   postgres— PostgreSQL 16 (canonical data store)
#   redis   — Redis 7 (sessions, rate limiting, BullMQ)
#
# Usage:
#   cp .env.example .env   # edit .env with real secrets
#   docker compose -f docker-compose.prod.yml up -d --scale api=3

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — Caddy v2 with automatic Let's Encrypt SSL
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sourcesignal
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Replicated stateless API (scale with --scale api=3)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: sourcesignal-api:latest
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      API_URL: ${API_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-sourcesignal}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    networks:
      - sourcesignal
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3001,path:'/healthz',timeout:2000},r=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Dedicated background worker (BullMQ processor)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: sourcesignal-worker:latest
    command: ["node", "dist/workers/background.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-sourcesignal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    networks:
      - sourcesignal
    restart: always

  # ---------------------------------------------------------------------------
  # PgBouncer — transaction-mode connection pooler
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:5432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    networks:
      - sourcesignal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — canonical data store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sourcesignal}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "listen_addresses=*"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sourcesignal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sourcesignal
    restart: always

  # ---------------------------------------------------------------------------
  # Redis 7 — sessions, rate limiting, BullMQ
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sourcesignal
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  sourcesignal:
    driver: bridge
    enable_ipv6: false
