# SourceSignal Backend — Production manifest
#
# Services:
#   traefik  — Edge router / load balancer in front of replicated API instances
#   api      — Replicated Node.js / Fastify API (stateless)
#   worker   — Dedicated BullMQ background worker (webhooks, ingestion, hashing)
#   pgbouncer— Connection pooler in transaction mode (fronts PostgreSQL)
#   postgres — PostgreSQL 16 (canonical data store)
#   redis    — Redis 7 (sessions, rate limiting, BullMQ)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --scale api=3
#
# All runtime state lives in Redis / object storage; the API is stateless and
# safe to replicate horizontally behind Traefik.

services:
  # ---------------------------------------------------------------------------
  # Edge router / load balancer
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=http"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=traefik"
      - "traefik.http.routers.traefik.service=api@internal"
    networks:
      - sourcesignal

  # ---------------------------------------------------------------------------
  # Replicated stateless API (scale with --scale api=N)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: sourcesignal-api:latest
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@pgbouncer:5432/sourcesignal}
      - REDIS_URL=${REDIS_URL:-redis://:password@redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=http"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
    networks:
      - sourcesignal

  # ---------------------------------------------------------------------------
  # Dedicated background worker (BullMQ processor)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: sourcesignal-worker:latest
    command: ["node", "dist/src/workers/background.worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@pgbouncer:5432/sourcesignal}
      - REDIS_URL=${REDIS_URL:-redis://:password@redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - BULLMQ_PREFIX=sourcesignal
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    networks:
      - sourcesignal

  # ---------------------------------------------------------------------------
  # PgBouncer — transaction-mode connection pooler
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: bitnami/pgbouncer:1.22
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT_NUMBER=5432
      - POSTGRESQL_DATABASE=${POSTGRES_DB:-sourcesignal}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - ./pgbouncer.ini:/opt/bitnami/pgbouncer/conf/pgbouncer.ini:ro
    depends_on:
      - postgres
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - sourcesignal

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — canonical data store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-sourcesignal}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sourcesignal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sourcesignal

  # ---------------------------------------------------------------------------
  # Redis 7 — sessions, rate limiting, BullMQ
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-password}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sourcesignal

volumes:
  postgres_data:
  redis_data:

networks:
  sourcesignal:
    driver: bridge
